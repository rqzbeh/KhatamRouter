name: Verify

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Verify / Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bun.lock

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies (root)
        run: |
          set -euo pipefail
          bun install

      - name: Typecheck core
        run: |
          set -euo pipefail
          npx tsc --noEmit -p tsconfig.typecheck-core.json

      - name: Typecheck API
        run: |
          set -euo pipefail
          npx tsc --noEmit -p tsconfig.typecheck-api.json

  baselines:
    name: Verify / Baselines
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bun.lock

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies (root)
        run: |
          set -euo pipefail
          bun install

      - name: Install dependencies (tests)
        working-directory: tests
        run: |
          set -euo pipefail
          bun install

      - name: Baseline - provider registry
        run: |
          set -euo pipefail
          node tests/__baseline__/verify-providers.mjs

      - name: Baseline - model aliases
        run: |
          set -euo pipefail
          node tests/__baseline__/verify-alias.mjs

      - name: Baseline - OAuth URLs
        run: |
          set -euo pipefail
          node tests/__baseline__/verify-oauth-urls.mjs

      - name: Docs claims
        run: |
          set -euo pipefail
          node scripts/verify-docs-claims.mjs

  unit-core:
    name: Verify / Unit (core)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bun.lock

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies (root)
        run: |
          set -euo pipefail
          bun install

      - name: Install dependencies (tests)
        working-directory: tests
        run: |
          set -euo pipefail
          bun install

      - name: Unit tests (core)
        working-directory: tests
        run: |
          set -euo pipefail
          npx vitest run --reporter=verbose \
            unit/capabilities.test.js \
            unit/capabilities-service-kind.test.js \
            unit/db-driver-chain.test.js \
            unit/db-migration-chain.test.js \
            unit/custom-server-peer-headers.test.js

  unit-wave:
    name: Verify / Unit (waves)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bun.lock

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies (root)
        run: |
          set -euo pipefail
          bun install

      - name: Install dependencies (tests)
        working-directory: tests
        run: |
          set -euo pipefail
          bun install

      - name: Unit tests (waves)
        working-directory: tests
        run: |
          set -euo pipefail
          npx vitest run --reporter=verbose \
            unit/wave1-bun-ts-redis-sqlite.test.js \
            unit/wave2-migrations.test.js \
            unit/wave2-quota-store.test.js \
            unit/wave3-acl.test.js \
            unit/wave3-limits.test.js \
            unit/wave4-docs-claims.test.js

  verify:
    name: Verify (tests + baselines)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [typecheck, baselines, unit-core, unit-wave]
    if: always()
    defaults:
      run:
        shell: bash
    steps:
      - name: Aggregate verification results
        run: |
          set -euo pipefail
          echo "typecheck=${{ needs.typecheck.result }}"
          echo "baselines=${{ needs.baselines.result }}"
          echo "unit-core=${{ needs.unit-core.result }}"
          echo "unit-wave=${{ needs.unit-wave.result }}"

          {
            echo "## Verify gate coverage"
            echo ""
            echo "Job status at summary time: \`${{ job.status }}\`"
            echo ""
            echo "### Parallel Verify Jobs Status"
            echo ""
            echo "| Job | Identifier | Result |"
            echo "| --- | --- | --- |"
            echo "| Verify / Typecheck | \`typecheck\` | \`${{ needs.typecheck.result }}\` |"
            echo "| Verify / Baselines | \`baselines\` | \`${{ needs.baselines.result }}\` |"
            echo "| Verify / Unit (core) | \`unit-core\` | \`${{ needs.unit-core.result }}\` |"
            echo "| Verify / Unit (waves) | \`unit-wave\` | \`${{ needs.unit-wave.result }}\` |"
            echo ""
            echo "### Checks that ran across parallel jobs"
            echo ""
            echo "1. **Typecheck** (\`typecheck\`):"
            echo "   - \`npx tsc --noEmit -p tsconfig.typecheck-core.json\`"
            echo "   - \`npx tsc --noEmit -p tsconfig.typecheck-api.json\`"
            echo "2. **Baselines** (\`baselines\`):"
            echo "   - \`node tests/__baseline__/verify-providers.mjs\` (94 providers)"
            echo "   - \`node tests/__baseline__/verify-alias.mjs\` (132 tokens)"
            echo "   - \`node tests/__baseline__/verify-oauth-urls.mjs\`"
            echo "   - \`node scripts/verify-docs-claims.mjs\`"
            echo "3. **Unit (core)** (\`unit-core\`):"
            echo "   - \`unit/capabilities.test.js\`"
            echo "   - \`unit/capabilities-service-kind.test.js\`"
            echo "   - \`unit/db-driver-chain.test.js\`"
            echo "   - \`unit/db-migration-chain.test.js\`"
            echo "   - \`unit/custom-server-peer-headers.test.js\`"
            echo "4. **Unit (waves)** (\`unit-wave\`):"
            echo "   - \`unit/wave1-bun-ts-redis-sqlite.test.js\`"
            echo "   - \`unit/wave2-migrations.test.js\`"
            echo "   - \`unit/wave2-quota-store.test.js\`"
            echo "   - \`unit/wave3-acl.test.js\`"
            echo "   - \`unit/wave3-limits.test.js\`"
            echo "   - \`unit/wave4-docs-claims.test.js\`"
            echo ""
            echo "### Checks deliberately excluded (this gate does NOT run them)"
            echo ""
            echo "- **Full vitest suite** (\`npx vitest run\` in tests/): NOT green on a plain checkout -"
            echo "  ~91 expected failures documented in CLAUDE.md, catalogued in"
            echo "  \`tests/__baseline__/known-fails.txt\`, plus \`unit/embeddings.cloud.test.js\`"
            echo "  (imports \`cloud/\` worker dir which is not in this repo) and \`tests/real/*.real.test.js\`"
            echo "  live provider calls that need credentials. Running it would leave the gate red forever."
            echo "- **Lint (\`npx eslint .\`)**, **build (\`npm run build\`)**, **e2e / live-provider tests**: not calibrated as exit 0 for this gate; out of scope for the initial PR verification gate."
            echo "- **\`tests/__baseline__/verify-no-regression.mjs\`**: not part of the calibrated set for this gate."
            echo ""
            echo "A green check here means all four parallel verify jobs succeeded."
          } >> "$GITHUB_STEP_SUMMARY"

          for r in "${{ needs.typecheck.result }}" "${{ needs.baselines.result }}" "${{ needs.unit-core.result }}" "${{ needs.unit-wave.result }}"; do
            if [ "$r" != "success" ]; then
              echo "::error::a parallel verify job did not succeed ($r)"
              exit 1
            fi
          done
          echo "all parallel verify jobs succeeded"

  build-image:
    name: Build container image (${{ matrix.arch }})
    needs: [verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.bun
          platforms: ${{ matrix.platform }}
          push: false
          load: false
          cache-from: type=gha,scope=khatam-image
          cache-to: type=gha,scope=khatam-image-${{ matrix.arch }},mode=max

      - name: Image build summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Container image build (${{ matrix.arch }})"
            echo ""
            echo "Dockerfile: \`./Dockerfile.bun\` (context: \`.\`, platform: \`${{ matrix.platform }}\`, push: disabled, nothing published)"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "**Result:** the image built successfully. The full multi-stage Docker build is verified on this PR."
            else
              echo "**Result:** the image build FAILED. \`./Dockerfile.bun\` could not be built for \`${{ matrix.platform }}\` - fix the Dockerfile/dependencies before merging."
            fi
            echo ""
            echo "Job status at summary time: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Smoke (run container)
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (smoke)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.bun
          platforms: linux/amd64
          push: false
          load: true
          tags: khatamrouter:smoke
          cache-from: type=gha,scope=khatam-image
          cache-to: type=gha,scope=khatam-image,mode=max

      - name: Assert no baked database
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh khatamrouter:smoke -c "test -z \"\$(find / -name '*.sqlite*' -not -path '/proc/*' -not -path '/sys/*' 2>/dev/null | head -1)\""

      - name: Boot container
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/khdata"
          chmod 777 "${{ runner.temp }}/khdata"

          docker run -d \
            --name kh-smoke \
            -p 20128:20128 \
            -v "${{ runner.temp }}/khdata:/app/data" \
            -e DATA_DIR=/app/data \
            -e JWT_SECRET=c0ffee1234567890abcdef1234567890c0ffee1234567890abcdef1234567890 \
            -e API_KEY_SECRET=c0ffee1234567890abcdef1234567890c0ffee1234567890abcdef1234567890 \
            khatamrouter:smoke

          echo "Polling up to 90s for HTTP readiness on 127.0.0.1:20128/dashboard..."
          READY=0
          for i in $(seq 1 90); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:20128/dashboard || true)
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ] || [ "$STATUS" = "307" ]; then
              READY=1
              echo "Container ready after ${i}s (HTTP status: $STATUS)"
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "::error::Container failed to become ready within 90s"
            exit 1
          fi

      - name: Assert HTTP endpoints
        run: |
          set -euo pipefail
          CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:20128/dashboard)
          echo "curl /dashboard returned HTTP code: $CODE"
          if [ "$CODE" != "200" ] && [ "$CODE" != "302" ] && [ "$CODE" != "307" ]; then
            echo "::error::Unexpected HTTP code from /dashboard: $CODE"
            exit 1
          fi

          HEALTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:20128/api/health || true)
          echo "curl /api/health returned HTTP code: $HEALTH_CODE"
          if [ "$HEALTH_CODE" = "200" ]; then
            echo "Health endpoint returned 200 OK"
          elif [ "$HEALTH_CODE" = "404" ]; then
            echo "Health endpoint returned 404 (noted)"
          fi

      - name: Assert runtime migrations
        run: |
          set -euo pipefail
          ROWS=$(docker exec kh-smoke sqlite3 /app/data/db/data.sqlite "SELECT version FROM _khatam_migrations ORDER BY version;")
          echo "Migrations applied:"
          echo "$ROWS"
          COUNT=$(echo "$ROWS" | grep -c . || true)
          if [ "$COUNT" -lt 2 ]; then
            echo "::error::Expected at least 2 migrations in _khatam_migrations, found $COUNT"
            exit 1
          fi

          JOURNAL=$(docker exec kh-smoke sqlite3 /app/data/db/data.sqlite "PRAGMA journal_mode;")
          echo "journal_mode: $JOURNAL"
          if [ "$JOURNAL" != "wal" ]; then
            echo "::error::Expected PRAGMA journal_mode to be wal, got $JOURNAL"
            exit 1
          fi

      - name: Assert ACL wiring
        run: |
          set -euo pipefail
          TABLES=$(docker exec kh-smoke sqlite3 /app/data/db/data.sqlite "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('api_key_quota_limits','request_cost_ledger');")
          echo "ACL tables present:"
          echo "$TABLES"
          if ! echo "$TABLES" | grep -q "api_key_quota_limits"; then
            echo "::error::Missing api_key_quota_limits table"
            exit 1
          fi
          if ! echo "$TABLES" | grep -q "request_cost_ledger"; then
            echo "::error::Missing request_cost_ledger table"
            exit 1
          fi

      - name: Dump container logs (tail)
        if: always()
        run: |
          echo "=== Last 50 container logs ==="
          docker logs --tail 50 kh-smoke || true

      - name: Dump full container logs on failure
        if: failure()
        run: |
          echo "=== Full container logs ==="
          docker logs kh-smoke || true

      - name: Cleanup smoke container
        if: always()
        run: |
          docker rm -f kh-smoke || true
