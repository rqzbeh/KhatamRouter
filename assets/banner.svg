<svg width="800" height="150" viewBox="0 0 800 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="800" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="160" y1="40" x2="520" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="icon-grad" x1="40" y1="35" x2="120" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="line-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="800" height="150" rx="12" fill="url(#bg-grad)"/>
  <rect x="0.5" y="0.5" width="799" height="149" rx="11.5" stroke="#1e293b" stroke-width="1"/>

  <!-- Subtle Background Grid Accent -->
  <circle cx="80" cy="75" r="56" fill="#6366f1" fill-opacity="0.08" filter="url(#glow)"/>
  <circle cx="700" cy="40" r="80" fill="#38bdf8" fill-opacity="0.04" filter="url(#glow)"/>

  <!-- Decorative Circuit Routing Lines on the Right -->
  <path d="M 620 45 L 680 45 L 710 75 L 760 75" stroke="url(#line-grad)" stroke-width="1.5" fill="none"/>
  <circle cx="620" cy="45" r="3" fill="#38bdf8"/>
  <circle cx="760" cy="75" r="3" fill="#818cf8"/>
  <path d="M 650 105 L 690 105 L 720 75" stroke="url(#line-grad)" stroke-width="1.5" fill="none"/>
  <circle cx="650" cy="105" r="3" fill="#c084fc"/>

  <!-- Gateway Hub Icon Badge -->
  <g transform="translate(42, 35)">
    <rect width="80" height="80" rx="18" fill="#1e1b4b" fill-opacity="0.6"/>
    <rect x="0.5" y="0.5" width="79" height="79" rx="17.5" stroke="#4338ca" stroke-opacity="0.5"/>

    <!-- Central Router Hub Symbol -->
    <circle cx="40" cy="40" r="10" fill="url(#icon-grad)"/>
    <circle cx="40" cy="40" r="5" fill="#ffffff"/>

    <!-- Satellite Nodes & Connection Links -->
    <line x1="40" y1="40" x2="18" y2="24" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="18" cy="24" r="4.5" fill="#38bdf8"/>

    <line x1="40" y1="40" x2="62" y2="24" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="62" cy="24" r="4.5" fill="#818cf8"/>

    <line x1="40" y1="40" x2="18" y2="56" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="18" cy="56" r="4.5" fill="#06b6d4"/>

    <line x1="40" y1="40" x2="62" y2="56" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="62" cy="56" r="4.5" fill="#c084fc"/>
  </g>

  <!-- Typography -->
  <text x="145" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.5">KhatamRouter</text>

  <text x="146" y="86" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">Universal AI Gateway &amp; Protocol Translator · Bun-Native · Multi-Core Cluster</text>

  <!-- Badges / Feature Tags -->
  <g transform="translate(146, 102)">
    <!-- Tag 1 -->
    <rect width="112" height="22" rx="6" fill="#0369a1" fill-opacity="0.25"/>
    <text x="56" y="15" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#7dd3fc" text-anchor="middle">Bun Runtime</text>

    <!-- Tag 2 -->
    <rect x="120" width="132" height="22" rx="6" fill="#4338ca" fill-opacity="0.25"/>
    <text x="186" y="15" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#a5b4fc" text-anchor="middle">Vertical Scaling</text>

    <!-- Tag 3 -->
    <rect x="260" width="128" height="22" rx="6" fill="#065f46" fill-opacity="0.25"/>
    <text x="324" y="15" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#6ee7b7" text-anchor="middle">bun:sqlite WAL</text>

    <!-- Tag 4 -->
    <rect x="396" width="138" height="22" rx="6" fill="#701a75" fill-opacity="0.25"/>
    <text x="465" y="15" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#f0abfc" text-anchor="middle">OpenAI Compatible</text>
  </g>
</svg>
