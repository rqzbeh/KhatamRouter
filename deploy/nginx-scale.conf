# ── Wave 8: Nginx Load Balancer for Multi-Replica KhatamRouter ──────────────
# Architecture:
#   - Round-robin upstream distribution across 9router replicas via DNS name.
#   - HTTP/1.1 persistent connections with upstream keepalive.
#   - SSE streaming support: proxy buffering disabled, 3600s read timeout.
#
# Security Contract:
#   - OVERWRITE X-Forwarded-For with $remote_addr.
#   - NEVER use append forwarding mode, which appends untrusted client values.
#   - Sets X-Real-IP to $remote_addr.

events {
    worker_connections 1024;
}

http {
    upstream 9router_backend {
        server 9router:20128;
        keepalive 32;
    }

    server {
        listen 20128;

        location / {
            proxy_pass http://9router_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Security: Overwrite client-supplied forwarding headers with real TCP peer IP
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;

            # Server-Sent Events (SSE) streaming support
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
