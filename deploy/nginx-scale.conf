# ── Wave 8: Nginx Load Balancer for Multi-Replica KhatamRouter ──────────────
# Architecture:
#   - Round-robin upstream distribution across 9router replicas via Docker internal DNS.
#   - Runtime DNS re-resolution via 127.0.0.11 with ipv6=off (app binds IPv4 0.0.0.0 only).
#   - Variable proxy_pass forces runtime re-resolution every ~5s on replica scale/restart.
#   - HTTP/1.1 persistent connections retained.
#   - SSE streaming support: proxy buffering disabled, 3600s read timeout.
#
# Security Contract:
#   - OVERWRITE X-Forwarded-For with $remote_addr.
#   - NEVER use append forwarding mode, which appends untrusted client values.
#   - Sets X-Real-IP to $remote_addr.

events {
    worker_connections 1024;
}

http {
    # Match the app request ingestion ceiling (experimental.proxyClientMaxBodySize: default 128mb)
    client_max_body_size 128m;

    # Docker embedded DNS resolver with 5s TTL and IPv6 disabled (app binds IPv4 only)
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 20128;

        location / {
            # Note: Using a variable in proxy_pass forces runtime DNS re-resolution via the
            # configured resolver so dynamic replica scaling/restarts are picked up every ~5s.
            # While variable proxy_pass disables upstream{} keepalive pooling, we retain
            # HTTP/1.1 and Connection "" for clean downstream-to-upstream header hygiene.
            set $khatam_upstream http://9router:20128;
            proxy_pass $khatam_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Security: Overwrite client-supplied forwarding headers with real TCP peer IP
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;

            # Server-Sent Events (SSE) streaming support
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
